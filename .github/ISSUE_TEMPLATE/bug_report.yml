name: Ошибка / Bug report
description: Сообщить об ошибке в Li Widget / Report a Li Widget bug
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Не прикладывайте VIN, данные аккаунта, пароли, токены или исходный APK.
        Remove personal data from screenshots. Report vulnerabilities privately via Security.
  - type: input
    id: versions
    attributes:
      label: Версии / Versions
      description: Li Widget, Li Auto, Android
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Телефон и лаунчер / Phone and launcher
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения / Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Ожидаемый и фактический результат / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Дополнительные сведения / Additional context
      description: Theme, language, widget size. Sanitize screenshots before attaching.
