name: Предложение / Feature request
description: Предложить улучшение / Suggest an improvement
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую задачу решаем? / What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое поведение / Proposed behavior
    validations:
      required: true
